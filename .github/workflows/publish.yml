name: Publish to Docker Hub
on:
  push:
    branches: [main]
    tags: ['*']
env:
  DOCKER_USERNAME: kozalo
  IMAGE_NAME: postgres-backupable
jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🔎 The ref is ${{ github.ref }} and your repository is ${{ github.repository }}."

      # main → latest + datetime; git tag "X.Y" → X.Y + X (never latest)
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDDHHmm'}},enable={{is_default_branch}}
            type=ref,event=tag
            type=match,pattern=^(\d+)\.,group=1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - run: echo "🍏 This job's status is ${{ job.status }}."
